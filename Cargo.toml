[package]
name = "rust-linear-regression"
version = "0.2.0"
edition = "2021"
description = "Regressão linear simples (mínimos quadrados) sem dependências externas"
license = "MIT"
repository = "https://github.com/Brunacoelhob/estudo-rust-regressao-linear"

[dependencies]

[lib]
name = "rust_linear_regression"
path = "src/lib.rs"

[[bin]]
name = "rust-linear-regression"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
